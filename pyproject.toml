[project]
name = "sheetwright"
version = "0.1.2"
description = "A toolkit for working with spreadsheets from Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Norman Hooper" }]

dependencies = [
    "click>=8.3.3",
    "mcp[cli]>=1.20,<2",
    "openpyxl>=3.1.5",
    "ruamel-yaml>=0.19.1",
    "testsweet>=0.2.0",
    "tomli-w>=1.2.0",
]

[project.scripts]
sheetwright = "sheetwright.cli:main"

[project.urls]
Homepage = "https://github.com/kaapstorm/sheetwright"
Source = "https://github.com/kaapstorm/sheetwright"
Documentation = "https://github.com/kaapstorm/sheetwright/blob/main/docs/README.md"
Changelog = "https://github.com/kaapstorm/sheetwright/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "ruff>=0.15.12",
    "types-openpyxl>=3.1.5.20260408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheetwright"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true

[tool.testsweet.discovery]
include_paths = ["tests"]
exclude_paths = ["tests/fixtures"]
test_files = ["test_*.py"]

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
files = ["src/sheetwright"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
